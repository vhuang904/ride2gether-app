<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- 針身漸層：午夜深藍金屬質感 -->
    <linearGradient id="cfPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- 圓形底盤內襯陰影 -->
    <radialGradient id="cfInnerGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <!-- 機長帽白色布面：立體隆起光澤 -->
    <linearGradient id="cfCapWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- 皇室金飾帶與徽章漸層 -->
    <linearGradient id="cfCapGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- 落地立體投影 -->
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. 落地小陰影 (指針接地處) -->
  <ellipse cx="50" cy="114" rx="14" ry="4" fill="#000000" opacity="0.35"/>

  <!-- 2. 立體水滴圖釘主體 -->
  <g filter="url(#pinShadow)">
    <path d="M 50 110 C 35 88, 12 65, 12 44 A 38 38 0 1 1 88 44 C 88 65, 65 88, 50 110 Z" 
          fill="url(#cfPinGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="50" cy="44" r="29" fill="url(#cfInnerGrad)" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- 3. 中央焦點：英倫資深禮賓高頂大蓋帽 (加高、放大、挺拔) -->
  <g transform="translate(0, -1)">
    <!-- 挺拔白色高帽冠 (上下拉高至 y:14，兩側弧形向上外擴，具立體份量感) -->
    <path d="M 23 42 C 20 20, 31 14, 50 14 C 69 14, 80 20, 77 42 Z" 
          fill="url(#cfCapWhite)" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- 帽身立體側陰影折線 (呈現布料硬挺支撐感) -->
    <path d="M 33 22 C 43 17, 57 17, 67 22" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- 黑色帽牆身 (厚實底座) -->
    <path d="M 24 42 Q 50 47 76 42 L 76 48 Q 50 53 24 48 Z" fill="#0F172A"/>

    <!-- 雙道金編飾線 (立體浮雕感) -->
    <path d="M 24 43.5 Q 50 48.5 76 43.5" stroke="url(#cfCapGold)" stroke-width="1.6" fill="none"/>
    <path d="M 24 46 Q 50 51 76 46" stroke="url(#cfCapGold)" stroke-width="1.6" fill="none"/>

    <!-- 正中央金色徽章與月桂葉 (放大突出) -->
    <circle cx="50" cy="37" r="3.8" fill="url(#cfCapGold)"/>
    <path d="M 42 38 Q 50 35 58 38 Q 50 39.5 42 38 Z" fill="url(#cfCapGold)"/>
    <circle cx="50" cy="37" r="1.5" fill="#FFFFFF"/>

    <!-- 黑色亮面大弧度漆皮帽簷 -->
    <path d="M 21 48 Q 50 55 79 48 C 76 53.5, 65 56.5, 50 56.5 C 35 56.5, 24 53.5, 21 48 Z" 
          fill="#020617" stroke="#334155" stroke-width="0.5"/>
  </g>
</svg>
