<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- 女客圖釘本體漸層：優雅深玫瑰金 -->
    <linearGradient id="vfPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D174D"/>
      <stop offset="50%" stop-color="#500724"/>
      <stop offset="100%" stop-color="#1E030F"/>
    </linearGradient>
    <!-- 圓形底盤內襯陰影 -->
    <radialGradient id="vfInnerGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#3B071E"/>
    </radialGradient>
    <!-- 落地立體投影 -->
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. 落地小陰影 (指針接地處) -->
  <ellipse cx="50" cy="114" rx="14" ry="4" fill="#000000" opacity="0.35"/>

  <!-- 2. 女客水滴圖釘主體 -->
  <g filter="url(#pinShadow)">
    <path d="M 50 110 C 35 88, 12 65, 12 44 A 38 38 0 1 1 88 44 C 88 65, 65 88, 50 110 Z" 
          fill="url(#vfPinGrad)" stroke="#F472B6" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="50" cy="44" r="29" fill="url(#vfInnerGrad)" stroke="#BE185D" stroke-width="1.5"/>
  </g>

  <!-- 3. 中央焦點：Header 1:1 R2G 官方皇冠標誌 -->
  <g transform="translate(19, 19) scale(0.62)">
    <path d="M26 48 C24 35, 36 28, 50 28 C64 28, 76 35, 74 48 C68 53, 32 53, 26 48 Z" fill="#991B1B" />
    <path d="M18 48 C14 36, 18 22, 28 20 C36 18, 42 26, 48 33" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M82 48 C86 36, 82 22, 72 20 C64 18, 58 26, 52 33" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M50 28 L50 49" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="38" r="2.2" fill="#FDE68A" />
    <rect x="20" y="49" width="60" height="8" rx="2.5" fill="#F59E0B" />
    <ellipse cx="50" cy="58" rx="26" ry="2.2" fill="#D97706" />
    <path d="M50 7 C47 13, 46 18, 50 22 C54 18, 53 13, 50 7 Z" fill="#F59E0B" />
    <path d="M49 19 C44 15, 40 16, 41 19 C42 22, 47 22, 49 22 Z" fill="#F59E0B" />
    <path d="M51 19 C56 15, 60 16, 59 19 C58 22, 53 22, 51 22 Z" fill="#F59E0B" />
    <rect x="46.5" y="21.5" width="7" height="2" rx="0.5" fill="#B45309" />
  </g>
</svg>
