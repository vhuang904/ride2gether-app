<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- 男客針身：皇家深藍金屬光澤 --> 
    <linearGradient id="vmPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="vmInnerGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- R2G 特色深紅絨天鵝絨 -->
    <linearGradient id="r2gVelvetRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <!-- R2G 奢華金拱 -->
    <linearGradient id="r2gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. 落地小陰影 -->
  <ellipse cx="50" cy="114" rx="14" ry="4" fill="#000000" opacity="0.35"/>

  <!-- 2. 男客水滴圖釘主體 -->
  <g filter="url(#pinShadow)">
    <path d="M 50 110 C 35 88, 12 65, 12 44 A 38 38 0 1 1 88 44 C 88 65, 65 88, 50 110 Z" 
          fill="url(#vmPinGrad)" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="50" cy="44" r="29" fill="url(#vmInnerGrad)" stroke="#1D4ED8" stroke-width="1.5"/>
  </g>

  <!-- 3. 中央焦點：R2G 官方經典紅絨金拱皇冠 -->
  <g transform="translate(0, 5)">
    <!-- 紅絨雙拱內襯 -->
    <path d="M 29 48 C 29 32, 44 32, 50 38 C 56 32, 71 32, 71 48 Z" fill="url(#r2gVelvetRed)"/>
    <!-- 雙金色交織拱帶 -->
    <path d="M 29 48 C 28 30, 48 27, 50 36 C 47 29, 31 31, 31 48" fill="none" stroke="url(#r2gGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 71 48 C 72 30, 52 27, 50 36 C 53 29, 69 31, 69 48" fill="none" stroke="url(#r2gGold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="36" x2="50" y2="48" stroke="url(#r2gGold)" stroke-width="2"/>
    <!-- 頂端皇家十字飾 -->
    <circle cx="50" cy="27" r="2.5" fill="url(#r2gGold)"/>
    <path d="M 50 22 L 50 31 M 45 26 L 55 26" stroke="url(#r2gGold)" stroke-width="2" stroke-linecap="round"/>
    <!-- 底部厚實黃金帶與白珍珠/寶石點 -->
    <rect x="27" y="47" width="46" height="7" rx="3.5" fill="url(#r2gGold)" stroke="#B45309" stroke-width="0.6"/>
    <circle cx="33" cy="50.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="41.5" cy="50.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="50" cy="50.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="58.5" cy="50.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="67" cy="50.5" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
