    <line x1="14" y1="0" x2="20" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="0" y2="-14" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="15" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    
    <circle cx="0" cy="0" r="9" fill="none" stroke="#FDE68A" stroke-width="1.8" stroke-dasharray="3, 2"/>
    
    <circle cx="0" cy="0" r="4.5" fill="#F59E0B"/>
