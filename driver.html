<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Ride2gether | Driver Reception</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      background: #f8fafc !important;
      color: #0f172a !important;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <a href="index.html" class="flex items-center gap-3">
        <img src="icon.svg" alt="Ride2gether" class="h-10 w-10">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Ride2gether</p>
          <h1 class="text-lg font-bold text-slate-900">Driver Reception</h1>
        </div>
      </a>
      <span class="rounded-full border border-blue-100 bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-600">
        <span class="mr-1 inline-block h-2 w-2 rounded-full bg-blue-600"></span>Live
      </span>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl space-y-5 px-4 py-6 sm:px-6">
    <section class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-600">Available orders</p>
          <h2 class="mt-1 text-2xl font-bold text-slate-900">Ready for pickup</h2>
        </div>
        <span id="orderCount" class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-600">0 pending</span>
      </div>
      <p id="driverStatus" class="mt-3 text-sm text-slate-600" role="status">Connecting to order dispatch...</p>
    </section>

    <section id="ordersContainer" class="space-y-4" aria-live="polite">
      <div class="rounded-2xl border border-slate-100 bg-white p-8 text-center text-sm text-slate-600 shadow-sm">
        Loading pending orders...
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/driver.js"></script>
</body>
</html>
