<!-- 專屬司機 (管家) SVG: 36px/48px 通用 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-10 h-10 drop-shadow-md">
  <defs>
    <!-- 背景光暈 -->
    <radialGradient id="bgGradChauffeur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <!-- 膚色漸層 -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F0B58D"/>
    </linearGradient>
    <!-- 金色邊飾漸層 -->
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="50%" stop-color="#FDA085"/>
      <stop offset="100%" stop-color="#F6D365"/>
    </linearGradient>
  </defs>

  <!-- 圓形底盤 -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGradChauffeur)" stroke="#334155" stroke-width="2"/>

  <!-- 身體 / 西裝肩線 (白襯衫 + 領結) -->
  <path d="M22 84 C22 66, 32 62, 50 62 C68 62, 78 66, 78 84 Z" fill="#FFFFFF"/>
  <path d="M30 84 C30 68, 38 65, 50 65 C62 65, 70 68, 70 84 Z" fill="#0F172A"/>
  <!-- 香檳金領結 -->
  <polygon points="45,67 55,67 50,71" fill="url(#goldCapGrad)"/>
  <polygon points="45,71 55,71 50,67" fill="url(#goldCapGrad)"/>
  <circle cx="50" cy="69" r="1.5" fill="#FFFFFF"/>

  <!-- 臉部 (親和輪廓) -->
  <circle cx="50" cy="46" r="15" fill="url(#faceGrad)"/>
  <!-- 眼睛與親切微笑 -->
  <circle cx="45" cy="46" r="1.8" fill="#334155"/>
  <circle cx="55" cy="46" r="1.8" fill="#334155"/>
  <path d="M47 52 Q50 55 53 52" stroke="#B45309" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- 禮賓大盤帽 (Chauffeur Cap) -->
  <!-- 帽冠主體 -->
  <path d="M33 38 C32 26, 68 26, 67 38 Z" fill="#1E293B"/>
  <path d="M34 32 C38 27, 62 27, 66 32" stroke="#334155" stroke-width="1.5" fill="none"/>
  <!-- 金色帽箍飾帶 -->
  <path d="M32 38 Q50 41 68 38 L68 40 Q50 43 32 40 Z" fill="url(#goldCapGrad)"/>
  <!-- 帽徽小金圓章 -->
  <circle cx="50" cy="37" r="2.5" fill="#FDE047"/>
  <!-- 黑色漆皮立體帽簷 -->
  <path d="M30 40 Q50 46 70 40 Q50 42 30 40 Z" fill="#090D16"/>
</svg>
