<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ride2gether | Live Trip Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <p>Redirecting to live trip tracking…</p>
  <script>
    // 分享連結固定為 /track.html?tripId=xxx，此處純轉址到既有的乘客端
    // 唯讀追蹤模式 (index.html?track=xxx)，避免重複實作一套地圖/監聽邏輯。
    (function () {
      var params = new URLSearchParams(window.location.search);
      var tripId = params.get('tripId');
      var target = tripId ? './index.html?track=' + encodeURIComponent(tripId) : './index.html';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
